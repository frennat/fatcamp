# Supabase's free tier pauses a project after ~a week without traffic, which
# would silently take down the waitlist, leaderboards, and the AI reader
# while the app itself carried on. Two pings a week is "traffic".
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mon + Thu, 09:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST endpoint
        run: |
          curl -sf -o /dev/null -m 30 \
            "https://chghvwnytjlakuvkkluv.supabase.co/rest/v1/standings?select=lifter&limit=1" \
            -H "apikey: sb_publishable_H69bdgZ5FdZIojX5LHK3aQ_2Vz2CZif" \
            -H "Authorization: Bearer sb_publishable_H69bdgZ5FdZIojX5LHK3aQ_2Vz2CZif" \
            || echo "ping failed — project may be paused"
